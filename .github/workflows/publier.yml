name: Vérifier la formation

# Le site est publié par GitHub Pages directement depuis la branche main (racine).
# Ce workflow vérifie que les contenus sont valides et que les fichiers générés
# (index.html, contenus/contenu.js, exports/*.zip) correspondent bien aux sources.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Conserver les packages versionnés
        run: cp -R exports /tmp/exports-versionnes

      - name: Valider les contenus et reconstruire
        run: ./build.sh

      - name: Vérifier que les fichiers générés sont à jour
        run: |
          python3 - <<'EOF'
          import sys, zipfile
          from pathlib import Path
          ecarts = []
          for neuf in sorted(Path("exports").glob("*.zip")):
              ancien = Path("/tmp/exports-versionnes") / neuf.name
              if not ancien.exists():
                  ecarts.append(f"{neuf} absent du dépôt")
                  continue
              crc = lambda p: sorted((i.filename, i.CRC) for i in zipfile.ZipFile(p).infolist())
              if crc(neuf) != crc(ancien):
                  ecarts.append(f"{neuf} ne correspond plus aux sources")
          for e in ecarts:
              print("::error::" + e)
          sys.exit(1 if ecarts else 0)
          EOF
          if ! git diff --quiet -- index.html contenus/contenu.js; then
            echo "::error::index.html ou contenus/contenu.js n'est pas à jour : lancer ./build.sh puis committer."
            git diff --stat -- index.html contenus/contenu.js
            exit 1
          fi

      - name: Conserver les packages SCORM
        uses: actions/upload-artifact@v4
        with:
          name: packages-scorm
          path: exports/*.zip

  tester-tuteur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Installer GovTutor et ses tests
        run: python -m pip install -e './tuteur[dev]'
      - name: Tester le simulateur et le pont HTTP
        run: python -m pytest -q tuteur/tests
      - name: Construire la formation
        run: ./build.sh
      - name: Installer les tests navigateur
        run: |
          npm install --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Vérifier la formation sans service Python
        run: npm test
      - name: Vérifier le parcours avec le checkpoint PPO réel
        run: npm run test:rl
      - name: Conserver le rapport et la capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-tuteur
          path: |
            dist/rapport-navigateur.json
            dist/tuteur-activite.png
